name: Build torch_c10d_nccl Windows Wheel

on:
  workflow_dispatch:
    inputs:
      cuda-version:
        description: "CUDA version"
        required: false
        type: string
        default: "12.8.0"
      torch-version:
        description: "PyTorch version"
        required: false
        type: string
        default: "2.11.0"
      python-version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"
      cuda-archs:
        description: "CUDA architectures (e.g. 80;86;89;90)"
        required: false
        type: string
        default: "80;86;89;90"
  push:
    branches:
      - torch-c10d-nccl
    paths:
      - 'bindings/torch_c10d_nccl/**'
      - '.github/workflows/build_torch_c10d_nccl.yml'

jobs:
  build-wheel:
    runs-on: windows-2022
    name: Build Wheel (Win-cu128-py312)
    env:
      CUDA_VER: ${{ inputs.cuda-version || '12.8.0' }}
      TORCH_VER: ${{ inputs.torch-version || '2.11.0' }}
      PYTHON_VER: ${{ inputs.python-version || '3.12' }}
      CUDA_ARCHS: ${{ inputs.cuda-archs || '80;86;89;90' }}

    steps:
      - name: Enable long paths in Windows and Git
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Set up MSVC Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VER }}
          method: "network"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: 'pip'

      - name: Verify Build Environment
        shell: powershell
        run: |
          Write-Host "=== System & Toolchain Info ==="
          cmake --version
          nvcc --version
          python --version
          Write-Host "CUDA_PATH: $env:CUDA_PATH"

      - name: Configure CMake for NCCL
        shell: powershell
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_ARCHITECTURES="$env:CUDA_ARCHS" `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_CUDA_STANDARD=17 `
            -DBUILD_NCCL4PY=OFF `
            -DWERROR=OFF

      - name: Build and Install NCCL
        shell: powershell
        run: |
          cmake --build build --config Release --target nccl --parallel
          cmake --install build --prefix install_nccl --config Release
          Write-Host "Installed NCCL tree:"
          Get-ChildItem -Recurse install_nccl | Select-Object FullName

      - name: Install PyTorch and Build Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel
          Write-Host "Installing PyTorch $env:TORCH_VER + cu128..."
          python -m pip install "torch==$env:TORCH_VER" --index-url https://download.pytorch.org/whl/cu128

      - name: Build torch_c10d_nccl Wheel
        shell: powershell
        run: |
          $repoRoot = (Get-Item .).FullName
          $env:NCCL_DIR = "$repoRoot\install_nccl"
          Write-Host "NCCL_DIR: $env:NCCL_DIR"

          Set-Location bindings\torch_c10d_nccl
          python setup.py bdist_wheel -d "$repoRoot\dist"
          Set-Location $repoRoot

          Write-Host "=== Generated Distribution Files ==="
          Get-ChildItem dist\*.whl | Select-Object Name, Length

      - name: Test Wheel Installation & Verification
        shell: powershell
        run: |
          $wheel = (Get-Item dist\*.whl).FullName
          Write-Host "Testing installation of $wheel..."
          python -m pip install $wheel

          python -c @"
          import torch
          import torch_c10d_nccl
          import torch.distributed as dist

          print('=== PyTorch NCCL Smoke Test ===')
          print('PyTorch Version:', torch.__version__)
          print('CUDA Available:', torch.cuda.is_available())
          print('NCCL Available:', dist.is_nccl_available())
          assert dist.is_nccl_available(), 'dist.is_nccl_available() returned False!'
          print('ProcessGroupNCCL Class:', dist.ProcessGroupNCCL)
          print('ProcessGroupNCCL Options:', dist.ProcessGroupNCCL.Options)
          print('SUCCESS: Route B (torch_c10d_nccl) verified working cleanly!')
          "@

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torch_c10d_nccl-win-cu${{ env.CUDA_VER }}-py${{ env.PYTHON_VER }}
          path: dist/*.whl
