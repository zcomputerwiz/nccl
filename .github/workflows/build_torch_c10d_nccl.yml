name: Build torch_c10d_nccl Windows Wheel

on:
  workflow_dispatch:
    inputs:
      cuda-version:
        description: "CUDA version"
        required: false
        type: string
        default: "12.8.0"
      torch-version:
        description: "PyTorch version"
        required: false
        type: string
        default: "2.11.0"
      python-version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"
      cuda-archs:
        description: "CUDA architectures (e.g. 80;86;89;90)"
        required: false
        type: string
        default: "80;86;89;90"
  push:
    branches:
      - torch-c10d-nccl
    paths:
      - 'bindings/torch_c10d_nccl/**'
      - '.github/workflows/build_torch_c10d_nccl.yml'

jobs:
  build-wheel:
    runs-on: windows-2022
    name: Build Wheel (Win-cu128-py312)
    env:
      CUDA_VER: ${{ inputs.cuda-version || '12.8.0' }}
      TORCH_VER: ${{ inputs.torch-version || '2.11.0' }}
      PYTHON_VER: ${{ inputs.python-version || '3.12' }}
      CUDA_ARCHS: ${{ inputs.cuda-archs || '80;86;89;90' }}
      DISTUTILS_USE_SDK: '1'

    steps:

      - name: Enable long paths in Windows and Git
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Set up MSVC Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VER }}
          method: "network"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: 'pip'

      - name: Verify Build Environment
        shell: bash
        run: |
          echo "=== System & Toolchain Info ==="
          cmake --version
          nvcc --version || true
          python --version
          echo "CUDA_PATH: ${CUDA_PATH:-none}"

      - name: Cache Installed NCCL
        id: cache_nccl
        uses: actions/cache@v4
        with:
          path: install_nccl
          key: nccl-install-cu${{ env.CUDA_VER }}-archs-${{ env.CUDA_ARCHS }}-${{ hashFiles('src/**', 'CMakeLists.txt') }}

      - name: Configure CMake for NCCL
        if: steps.cache_nccl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCHS}" \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CUDA_STANDARD=17 \
            -DBUILD_NCCL4PY=OFF \
            -DWERROR=OFF

      - name: Build NCCL
        if: steps.cache_nccl.outputs.cache-hit != 'true'
        id: build_nccl
        shell: bash
        run: |
          EXIT_CODE=0
          cmake --build build --config Release --parallel || EXIT_CODE=$?
          echo "build_exit_code=$EXIT_CODE" | tee -a "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Log build failure diagnostics
        if: always() && steps.cache_nccl.outputs.cache-hit != 'true' && steps.build_nccl.outputs.build_exit_code != 0
        shell: bash
        run: |
          echo "=== Workspace Directory Listing ==="
          ls -la ./
          if [ -d "build" ]; then
            echo "=== Build Directory Listing ==="
            ls -la build/
          fi

      - name: Install NCCL
        if: steps.cache_nccl.outputs.cache-hit != 'true' && steps.build_nccl.outputs.build_exit_code == 0
        shell: bash
        run: |
          cmake --install build --prefix install_nccl --config Release
          echo "=== Installed NCCL Contents ==="
          find install_nccl -type f

      - name: Install PyTorch and Build Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel ninja
          echo "Installing PyTorch ${TORCH_VER} + cu128..."
          python -m pip install "torch==${TORCH_VER}" --index-url https://download.pytorch.org/whl/cu128

      - name: Build torch_c10d_nccl Wheel
        shell: bash
        env:
          DISTUTILS_USE_SDK: '1'
        run: |
          REPO_ROOT=$(pwd -W 2>/dev/null || pwd)
          export NCCL_DIR="${REPO_ROOT}/install_nccl"
          export DISTUTILS_USE_SDK=1
          echo "NCCL_DIR: ${NCCL_DIR}"

          cd bindings/torch_c10d_nccl
          python setup.py bdist_wheel -d "${REPO_ROOT}/dist"
          cd "${REPO_ROOT}"

          echo "=== Generated Distribution Files ==="
          ls -la dist/


      - name: Test Wheel Installation & Verification
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -c "
          import torch
          import torch_c10d_nccl
          import torch.distributed as dist

          print('=== PyTorch NCCL Smoke Test ===')
          print('PyTorch Version:', torch.__version__)
          print('CUDA Available:', torch.cuda.is_available())
          print('NCCL Available:', dist.is_nccl_available())
          assert dist.is_nccl_available(), 'dist.is_nccl_available() returned False!'
          print('ProcessGroupNCCL Class:', dist.ProcessGroupNCCL)
          print('ProcessGroupNCCL Options:', dist.ProcessGroupNCCL.Options)
          print('SUCCESS: Route B (torch_c10d_nccl) verified working cleanly!')
          "

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torch_c10d_nccl-win-cu${{ env.CUDA_VER }}-py${{ env.PYTHON_VER }}
          path: dist/*.whl
